[project]
name = "portfolio-analytics-mcp"
version = "0.1.0"
description = "MCP server for portfolio analysis on top of yfinance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0,<2",
    "yfinance>=0.2.50",
    "pandas==3.0.6",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "numpy>=2.0",
    "pydantic>=2.7",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_mcp"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pandas-stubs==3.0.5.260914",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["finance_mcp"]

[tool.poe.tasks]
format = { help = "Format code and sort imports (writes files)", sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix --select I ." },
] }
format-check = { help = "Verify formatting without writing files (CI)", cmd = "ruff format --check ." }
lint = { help = "Lint with ruff (no changes)", cmd = "ruff check ." }
typecheck = { help = "Type check with basedpyright", cmd = "basedpyright" }
check = { help = "Quick local check: lint + type check", sequence = ["lint", "typecheck"] }
ci = { help = "Everything CI runs, read-only: format-check + lint + typecheck", sequence = ["format-check", "lint", "typecheck"] }
fix = { help = "Auto-format and fix lint issues", sequence = ["format", "lint"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

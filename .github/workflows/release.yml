name: Release

# Pushing a tag like v1.2.3 runs the checks, builds version 1.2.3 (taken from
# the tag by hatch-vcs) and publishes it to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history and tags, so hatch-vcs sees the tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked
      - run: uv run poe ci-checks
      - run: uv build
      # Guard against a tag on the wrong commit or an unexpected version.
      - name: Check version matches tag
        run: |
          expected="$(uv run --with packaging python -c \
            'from packaging.version import Version; import sys; print(Version(sys.argv[1]))' \
            "${GITHUB_REF_NAME#v}")"
          ls dist
          test -f "dist/portfolio_analytics_mcp-${expected}-py3-none-any.whl" \
            || { echo "Built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/portfolio-analytics-mcp/
    permissions:
      id-token: write # trusted publishing: PyPI accepts this job's identity, no token stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv publish --trusted-publishing always
